<p id="crud-feedback" role="status" aria-live="polite" class="crud-feedback"></p>
<dialog id="crud-dialog" aria-labelledby="crud-title">
  <form id="crud-form">
    <h2 id="crud-title"></h2>
    <div id="crud-fields"></div>
    <p id="crud-error" role="alert"></p>
    <div class="crud-buttons">
      <button type="button" id="crud-cancel" class="btn-icon">Cancelar</button>
      <button type="submit" id="crud-save" class="btn-primary">Salvar</button>
    </div>
  </form>
</dialog>
