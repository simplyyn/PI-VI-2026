<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBiz AI — Entrar</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    (function () {
      var d = localStorage.getItem('smartbiz-dark');
      if (d === '1') document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body class="login-body">

  <div class="login-card">

    <div class="login-logo">
      <i data-lucide="bot"></i>
      <h1>Smart<span>Biz</span></h1>
    </div>

    <p class="login-subtitle">Entre na sua conta para continuar</p>

    {% if erro %}
    <div class="login-erro">
      <i data-lucide="alert-circle"></i>
      {{ erro }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="login-form">

      <div class="login-field">
        <label>E-mail</label>
        <div class="login-input-wrap">
          <i data-lucide="mail"></i>
          <input
            type="email"
            name="email"
            placeholder="seu@email.com"
            value="{{ email if email else '' }}"
            required
            autofocus
          >
        </div>
      </div>

      <div class="login-field">
        <label>Senha</label>
        <div class="login-input-wrap">
          <i data-lucide="lock"></i>
          <input
            type="password"
            name="senha"
            placeholder="••••••••"
            required
          >
        </div>
      </div>

      <button type="submit" class="login-btn">
        Entrar <i data-lucide="arrow-right"></i>
      </button>

    </form>

    <div class="login-hint">
      <strong>Contas de demonstração:</strong><br>
      Admin — admin@smartbiz.com / admin123<br>
      Dono — joao@padaria.com / dono123<br>
      Cliente — maria@cliente.com / cliente123
    </div>

  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
