<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · SmartDent</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/interface.css">
  <script>document.documentElement.classList.toggle('dark', localStorage.getItem('smartdent-dark') === '1');</script>
</head>
<body class="login-body">
  <main class="login-card">
    <p class="workspace-wordmark">SmartDent</p>
    <h1>Entrar</h1>
    {% if erro %}<p class="login-erro" role="alert">{{ erro }}</p>{% endif %}
    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf', '') }}">
      <div class="login-field">
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" name="email" value="{{ email or '' }}" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="login-password">Senha</label>
        <input id="login-password" type="password" name="senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
  </main>
</body>
</html>
