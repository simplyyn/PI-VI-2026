<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · SmartDent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('smartdent-tema')||'light');</script>
  <style>
    body{overflow:auto}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}
    .theme-corner{position:absolute;top:20px;right:20px}
    .login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:34px 32px;box-shadow:0 24px 70px rgba(0,0,0,.12)}
    .login-card .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
    .login-card .logo{width:42px;height:42px;border-radius:12px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center}
    .login-card .logo svg{width:24px;height:24px}
    .login-card .brand b{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
    .login-card .brand small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-fg)}
    .login-card h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
    .login-card .sub{font-size:.88rem;color:var(--muted-fg);margin-bottom:22px}
    .login-erro{background:var(--neg-bg);color:var(--neg);border:1px solid var(--neg);border-radius:10px;padding:10px 14px;font-size:.86rem;font-weight:500;margin-bottom:18px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:.85rem;font-weight:600;margin-bottom:7px}
    .field input{width:100%;height:44px;padding:0 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-family:var(--font);font-size:.92rem;color:var(--fg)}
    .field input:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 40%,transparent)}
    .login-card button.submit{width:100%;height:44px;margin-top:6px;border:none;border-radius:10px;background:var(--primary);color:var(--primary-fg);font-family:var(--font);font-weight:700;font-size:.95rem;cursor:pointer}
    .login-card button.submit:hover{opacity:.92}
    .login-foot{margin-top:20px;text-align:center;font-size:.8rem;color:var(--muted-fg)}
  </style>
</head>
<body>
  <div class="login-wrap">
    <button class="iconbtn theme-corner" id="themeBtn" title="Alternar tema" type="button"><i data-lucide="moon" id="themeIcon"></i></button>
    <form method="post" action="/login" class="login-card">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c-1.6 0-2.5.9-4.3.9-1.2 0-2-.3-3-.3C2.5 2.8 1.6 4.4 1.6 6.6c0 1.9.6 3.3 1.2 5.4.3 1 .4 1.6.6 3 .4 2.6.6 5.4 1.9 5.4 1.2 0 1.3-3.3 1.6-5 .2-1.1.6-1.8 1.5-1.8s1.3.7 1.5 1.8c.3 1.7.4 5 1.6 5 1.3 0 1.5-2.8 1.9-5.4.2-1.4.3-2 .6-3 .6-2.1 1.2-3.5 1.2-5.4 0-2.2-.9-3.8-3.1-3.8-1 0-1.8.3-3 .3-1.8 0-2.7-.9-4.3-.9z"/></svg></div>
        <div><b>Smart<span style="color:var(--info)">Dent</span></b><small>AI Suite</small></div>
      </div>
      <h1>Entrar</h1>
      <p class="sub">Acesse o painel da clínica ou o portal do paciente.</p>
      {% if erro %}<div class="login-erro" role="alert">{{ erro }}</div>{% endif %}
      <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf', '') }}">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" name="email" value="{{ email or '' }}" autocomplete="username" placeholder="voce@exemplo.com" required>
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <input id="login-password" type="password" name="senha" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit">Entrar</button>
      <div class="login-foot">Clínica e paciente usam o mesmo acesso — o sistema direciona você automaticamente.</div>
    </form>
  </div>
  <script>
    (function(){
      const html=document.documentElement;
      function apply(t){html.setAttribute('data-theme',t);document.getElementById('themeIcon').setAttribute('data-lucide',t==='dark'?'sun':'moon');if(window.lucide)lucide.createIcons();localStorage.setItem('smartdent-tema',t);}
      document.addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons();apply(localStorage.getItem('smartdent-tema')||'light');document.getElementById('themeBtn').onclick=()=>apply(html.getAttribute('data-theme')==='dark'?'light':'dark');});
    })();
  </script>
</body>
</html>
