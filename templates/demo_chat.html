<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal do paciente · SmartDent</title>
  <script>
    document.documentElement.classList.toggle('dark', localStorage.getItem('smartdent-dark') === '1');
  </script>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/customer-chat.css">
</head>
<body class="patient-portal">
  <header class="portal-header">
    <div class="portal-header-content">
      <div class="portal-identity">
        <strong>SmartDent</strong>
        <span>{{ usuario.empresa_nome or usuario.empresa or 'Portal do paciente' }}</span>
      </div>
      <nav aria-label="Sessão">
        <span>{{ usuario.nome }}</span>
        <button type="button" id="btn-dark-toggle" aria-pressed="false">Modo escuro</button>
        <a href="/logout">Sair</a>
      </nav>
    </div>
  </header>

  <main class="portal-layout">
    <section class="portal-overview" aria-labelledby="appointments-title">
      <h2 id="appointments-title">Agendamentos</h2>
      <button type="button" class="portal-primary" id="start-booking">Agendar consulta</button>

      <section class="portal-booking" id="booking-options" aria-labelledby="options-title" hidden>
        <h3 id="options-title">Escolha um horário</h3>
        <div class="portal-options-row" id="booking-choices">
          <div class="portal-date">
            <label for="booking-date">Data</label>
            <select id="booking-date"></select>
          </div>
          <div id="booking-times" class="portal-times" role="group" aria-label="Horários disponíveis"></div>
        </div>
        <button type="button" class="portal-secondary" id="discard-options">Cancelar pedido</button>
      </section>

      <section class="portal-booking" id="booking-confirmation" aria-labelledby="confirmation-title" hidden>
        <h3 id="confirmation-title">Revise seu agendamento</h3>
        <p id="booking-review"></p>
        <div class="portal-actions">
          <button type="button" class="portal-primary" id="confirm-booking">Confirmar agendamento</button>
          <button type="button" class="portal-secondary" id="cancel-booking">Cancelar pedido</button>
        </div>
      </section>

      <details class="portal-appointments">
        <summary>Meus agendamentos</summary>
        <div id="customer-appointments"></div>
      </details>
    </section>

    <section class="portal-chat" aria-labelledby="chat-title">
      <h1 id="chat-title">Conversa com a clínica</h1>
      <div class="portal-log" id="demo-messages" role="log" aria-label="Histórico da conversa"></div>

      <p id="customer-feedback" role="status" class="portal-feedback"></p>
      <form id="portal-message-form" class="portal-compose">
        <div class="portal-message-row">
          <input type="text" id="demo-input" placeholder="Digite sua mensagem" autocomplete="off"
                 maxlength="2000" aria-label="Mensagem para a clínica" required>
          <button class="portal-primary" type="submit" id="send-message">Enviar</button>
        </div>
        <label class="portal-auto"><input type="checkbox" id="customer-auto" checked> Receber resposta automática da IA</label>
      </form>
    </section>
  </main>
  <script src="/static/customer-chat.js"></script>
  <script src="/static/session.js"></script>
</body>
</html>
