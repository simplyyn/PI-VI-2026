<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal do paciente · SmartDent</title>
  <script>document.documentElement.classList.toggle('dark', localStorage.getItem('smartdent-dark') === '1');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/answer-rating.css">
  <style>
    html.dark{
      --bg:#09090b;--fg:#fafafa;--card:#0c0c0f;--muted-bg:#18181b;--muted-fg:#a1a1aa;
      --border:#27272a;--ring:#3f3f46;--primary:#fafafa;--primary-fg:#18181b;
      --pos:#4ade80;--pos-bg:rgba(74,222,128,.14);--neg:#f87171;--neg-bg:rgba(248,113,113,.14);
      --info:#60a5fa;--info-bg:rgba(96,165,250,.14);
      --warn:#fbbf24;--warn-bg:rgba(251,191,36,.14);--violet:#a78bfa;--violet-bg:rgba(167,139,250,.14);
    }
    body.patient-portal{overflow:auto;background:var(--bg)}
    .portal-header{border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:5}
    .portal-header-content{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
    .portal-identity strong{font-weight:800;font-size:1.1rem}
    .portal-identity span{display:block;font-size:.76rem;color:var(--muted-fg)}
    .portal-header nav{display:flex;align-items:center;gap:14px;font-size:.86rem}
    .portal-header nav>span{color:var(--muted-fg)}
    #btn-dark-toggle{border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:.82rem;font-family:var(--font);cursor:pointer}
    .portal-header nav a{color:var(--fg);text-decoration:none;font-weight:600}
    .portal-layout{max-width:1080px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
    @media(max-width:860px){.portal-layout{grid-template-columns:1fr}}
    .portal-overview{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
    .portal-overview h2{font-size:1.1rem;font-weight:700;margin-bottom:14px}
    .portal-primary{width:100%;background:var(--primary);color:var(--primary-fg);border:none;border-radius:10px;padding:11px 16px;font-family:var(--font);font-weight:700;font-size:.9rem;cursor:pointer}
    .portal-primary:hover{opacity:.92}
    .portal-secondary{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-family:var(--font);font-weight:600;font-size:.85rem;cursor:pointer}
    .portal-secondary:hover{background:var(--muted-bg)}
    .portal-booking{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
    .portal-booking h3{font-size:.95rem;font-weight:700;margin-bottom:12px}
    .portal-options-row{display:flex;flex-direction:column;gap:12px}
    .portal-date label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px}
    .portal-date select{width:100%;height:40px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--fg);padding:0 10px;font-family:var(--font)}
    .portal-times{display:flex;flex-wrap:wrap;gap:8px}
    .portal-actions{display:flex;gap:10px;margin-top:12px}
    /* ---- Escolha do procedimento e do profissional ---- */
    .portal-picks{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding-right:2px}
    .portal-pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:.86rem;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
    .portal-pick:hover{border-color:var(--ring);background:var(--muted-bg)}
    .portal-pick:active{transform:scale(.99)}
    .portal-pick small{display:block;font-weight:500;font-size:.74rem;color:var(--muted-fg);margin-top:2px}
    .portal-pick .av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--info-bg);color:var(--info);font-weight:800;font-size:.8rem}
    .portal-pick.featured{border-color:var(--info)}
    .portal-step{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-fg);margin-bottom:4px}
    .portal-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:12px;border-radius:10px;background:var(--muted-bg);font-size:.84rem}
    .portal-summary b{font-weight:700}
    .portal-link{background:none;border:0;padding:0;color:var(--info);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
    .portal-link:hover{text-decoration:underline}

    /* ---- Meus agendamentos ---- */
    .portal-appointments{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}
    .portal-appointments summary{cursor:pointer;font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:8px}
    .portal-appointments summary .n{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:20px;background:var(--muted-bg);color:var(--muted-fg)}
    #customer-appointments{margin-top:12px;display:flex;flex-direction:column;gap:8px}
    #customer-appointments .group{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);margin:8px 2px 0}
    #customer-appointments .group:first-child{margin-top:0}
    #customer-appointments .none{font-size:.84rem;color:var(--muted-fg)}
    .appt{--c:var(--muted-fg);--cbg:var(--muted-bg);display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-left:4px solid var(--c);border-radius:11px;background:var(--card)}
    .appt.confirmado{--c:var(--pos);--cbg:var(--pos-bg)} .appt.pendente{--c:var(--warn);--cbg:var(--warn-bg)}
    .appt.cancelado{--c:var(--neg);--cbg:var(--neg-bg);opacity:.6} .appt.realizado{--c:var(--info);--cbg:var(--info-bg)}
    .appt.pendente{border-left-style:dashed}
    .appt .day{width:42px;flex:none;text-align:center;border-radius:9px;background:var(--cbg);color:var(--c);padding:5px 0;line-height:1.05}
    .appt .day b{display:block;font-size:1.15rem;font-weight:800}
    .appt .day small{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .appt .info{flex:1;min-width:0}
    .appt .info b{display:block;font-size:.86rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .appt.cancelado .info b{text-decoration:line-through}
    .appt .info span{display:block;font-size:.76rem;color:var(--muted-fg);margin-top:1px}
    .appt .chip{flex:none;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--cbg);color:var(--c)}
    .portal-chat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;display:flex;flex-direction:column;min-height:560px}
    #chat-title{font-size:1.15rem;font-weight:700;margin-bottom:14px}
    .portal-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px;max-height:62vh}
    .portal-log>p{color:var(--muted-fg);font-size:.9rem}
    .portal-message{max-width:78%;align-self:flex-start;background:var(--muted-bg);border:1px solid var(--border);border-radius:14px;border-top-left-radius:4px;padding:11px 14px}
    .portal-message.is-patient{align-self:flex-end;background:var(--info-bg);border-color:transparent;border-top-left-radius:14px;border-top-right-radius:4px}
    .portal-message p{font-size:.9rem;line-height:1.5}
    .portal-message small{display:block;margin-top:6px;font-size:.7rem;color:var(--muted-fg)}
    .portal-feedback{font-size:.82rem;color:var(--info);min-height:18px;margin:10px 0}
    .portal-compose{border-top:1px solid var(--border);padding-top:14px}
    .portal-message-row{display:flex;gap:10px}
    #demo-input{flex:1;height:44px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 14px;font-family:var(--font);font-size:.9rem}
    #demo-input:focus{outline:none;border-color:var(--ring)}
    .portal-message-row .portal-primary{width:auto;padding:0 20px}
    .portal-auto{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.82rem;color:var(--muted-fg)}
    .portal-chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .portal-chat-head h1{margin:0}
    .portal-clear{width:auto;padding:0 14px;font-size:.82rem}
    .portal-clear:hover{color:var(--neg,#dc2626);border-color:currentColor}
  </style>
</head>
<body class="patient-portal">
  <header class="portal-header">
    <div class="portal-header-content">
      <div class="portal-identity">
        <strong>SmartDent</strong>
        <span>{{ usuario.empresa_nome or usuario.empresa or 'Portal do paciente' }}</span>
      </div>
      <nav aria-label="Sessão">
        <span>{{ usuario.nome }}</span>
        <button type="button" id="btn-dark-toggle" aria-pressed="false">Modo escuro</button>
        <a href="/logout">Sair</a>
      </nav>
    </div>
  </header>

  <main class="portal-layout">
    <section class="portal-overview" aria-labelledby="appointments-title">
      <h2 id="appointments-title">Agendamentos</h2>
      <button type="button" class="portal-primary" id="start-booking">Agendar consulta</button>

      <section class="portal-booking" id="booking-pick" aria-labelledby="pick-title" hidden>
        <div class="portal-step" id="pick-step"></div>
        <h3 id="pick-title"></h3>
        <div class="portal-picks" id="pick-list"></div>
        <button type="button" class="portal-secondary" id="discard-pick" style="margin-top:12px">Cancelar</button>
      </section>

      <section class="portal-booking" id="booking-options" aria-labelledby="options-title" hidden>
        <div class="portal-step">Passo 3 de 3</div>
        <div class="portal-summary" id="booking-summary" hidden><span id="booking-summary-text"></span><button type="button" class="portal-link" id="change-procedure">Trocar</button></div>
        <h3 id="options-title">Escolha um horário</h3>
        <div class="portal-options-row" id="booking-choices">
          <div class="portal-date">
            <label for="booking-date">Data</label>
            <select id="booking-date"></select>
          </div>
          <div id="booking-times" class="portal-times" role="group" aria-label="Horários disponíveis"></div>
        </div>
        <button type="button" class="portal-secondary" id="discard-options" style="margin-top:12px">Cancelar pedido</button>
      </section>

      <section class="portal-booking" id="booking-confirmation" aria-labelledby="confirmation-title" hidden>
        <h3 id="confirmation-title">Revise seu agendamento</h3>
        <p id="booking-review" style="font-size:.88rem;color:var(--muted-fg)"></p>
        <div class="portal-actions">
          <button type="button" class="portal-primary" id="confirm-booking" style="width:auto">Confirmar agendamento</button>
          <button type="button" class="portal-secondary" id="cancel-booking">Cancelar pedido</button>
        </div>
      </section>

      <details class="portal-appointments" open>
        <summary>Meus agendamentos <span class="n" id="appointments-count">0</span></summary>
        <div id="customer-appointments"></div>
      </details>
    </section>

    <section class="portal-chat" aria-labelledby="chat-title">
      <div class="portal-chat-head">
        <h1 id="chat-title">Conversa com a clínica</h1>
        <button type="button" class="portal-secondary portal-clear" id="clear-chat" title="Apaga todas as mensagens desta conversa">Apagar conversa</button>
      </div>
      <div class="portal-log" id="demo-messages" role="log" aria-label="Histórico da conversa"></div>

      <p id="customer-feedback" role="status" class="portal-feedback"></p>
      <form id="portal-message-form" class="portal-compose">
        <div class="portal-message-row">
          <input type="text" id="demo-input" placeholder="Digite sua mensagem" autocomplete="off"
                 maxlength="2000" aria-label="Mensagem para a clínica" required>
          <button class="portal-primary" type="submit" id="send-message">Enviar</button>
        </div>
        <label class="portal-auto"><input type="checkbox" id="customer-auto" checked> Receber resposta automática da IA</label>
      </form>
    </section>
  </main>

  <script src="/static/answer-rating.js"></script>
  <script src="/static/customer-chat.js"></script>
  <script src="/static/session.js"></script>
</body>
</html>
